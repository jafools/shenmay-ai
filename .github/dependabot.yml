# Dependabot — keep the SHA-pinned GitHub Actions current (P3-10).
#
# The workflow `uses:` entries are pinned to full commit SHAs for
# supply-chain safety (a mutable tag like @v4 can be repointed at a
# malicious commit). Pins go stale, so Dependabot opens a PR that bumps
# the SHA + the trailing version comment whenever a new release lands.
# All action bumps are grouped into a single weekly PR to avoid noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"

  # Base-image updates for the two Dockerfiles. Flags a stale node:NN-alpine
  # weekly so the EOL-runtime gap that left prod on Node 20 past its 2026-04-30
  # end-of-life can't recur silently.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
