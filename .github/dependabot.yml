# Dependabot — keep the SHA-pinned GitHub Actions current (P3-10).
#
# The workflow `uses:` entries are pinned to full commit SHAs for
# supply-chain safety (a mutable tag like @v4 can be repointed at a
# malicious commit). Pins go stale, so Dependabot opens a PR that bumps
# the SHA + the trailing version comment whenever a new release lands.
# All action bumps are grouped into a single weekly PR to avoid noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
